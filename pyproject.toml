[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meitei"
version = "0.1.0"
description = "Lightweight, offline-first Python library for the Meitei (Manipuri / Meiteilon) language of Manipur, India."
readme = "README.md"
authors = [
    { name = "Meitei Language Project Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "meitei",
    "manipuri",
    "meiteilon",
    "meitei-mayek",
    "tibeto-burman",
    "northeast-india",
    "linguistics",
    "dictionary",
    "offline-first"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
meitei = "meitei.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meitei = ["py.typed", "data/**/*"]
meitei_lang = ["data/*", "py.typed"]

[tool.pyright]
include = ["src", "tests"]
